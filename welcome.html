<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traducteur de bulles</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 640px; margin: 40px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; }
  h1 { display: flex; align-items: center; gap: 12px; font-size: 26px; }
  h1 img { width: 48px; height: 48px; }
  ol { padding-left: 22px; }
  li { margin: 10px 0; }
  .note { padding: 12px 16px; border-radius: 10px; background: rgba(26,115,232,.1); margin: 16px 0; }
  .muted { opacity: .75; font-size: 14px; }
</style>
</head>
<body>
  <h1><img src="icons/icon128.png" alt=""><span data-i18n="welcomeTitle"></span></h1>
  <p data-i18n="welcomeIntro"></p>
  <ol>
    <li data-i18n="welcomeStep1"></li>
    <li data-i18n="welcomeStep2"></li>
    <li data-i18n="welcomeStep3"></li>
    <li data-i18n="welcomeStep4"></li>
  </ol>
  <p class="note" data-i18n="welcomeTip"></p>
  <p class="muted" data-i18n="welcomePrivacy"></p>
  <script src="i18n.js"></script>
</body>
</html>
